name: Watch official exam sources

on:
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  watch:
    runs-on: ubuntu-latest
    # The watch alone runs for minutes against slow official hosts, and npm ci
    # has taken four on a bad day. At 10 the job was cancelled mid-watch on
    # 4 Sep 2026, losing both the report and the freshness check.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify generated source registry is committed
        run: |
          npm run --silent data:registry
          git diff --exit-code -- data/source-registry.json
      - uses: actions/cache/restore@v6
        with:
          path: data/source-watch-state.json
          key: source-watch-${{ github.run_id }}
          restore-keys: source-watch-
      - id: watch
        run: |
          npm run --silent data:watch -- --write > source-watch-report.json
          cat source-watch-report.json >> "$GITHUB_STEP_SUMMARY"
          node --input-type=module -e 'import { readFileSync } from "node:fs"; const report = JSON.parse(readFileSync("source-watch-report.json", "utf8")); console.log(`actionable=${report.results.some(({ state }) => !["unchanged", "not-due"].includes(state))}`)' >> "$GITHUB_OUTPUT"
      - uses: actions/cache/save@v6
        if: always() && steps.watch.conclusion != 'skipped'
        with:
          path: data/source-watch-state.json
          key: source-watch-${{ github.run_id }}
      - uses: actions/upload-artifact@v7
        if: steps.watch.outputs.actionable == 'true'
        with:
          name: source-watch-report
          path: source-watch-report.json
          retention-days: 14

  # Turn stale data into a to-do list instead of a red run. The freshness gate
  # used to fail this workflow every morning (from 17 Oct 2026 on), which said
  # "something is wrong" without telling a broken pipeline apart from records
  # only a person can re-check against an official notice. Now a run fails only
  # when the pipeline itself breaks; records that need a person go into one
  # open issue, rewritten daily and closed once nothing is left. Free: no API
  # calls, only Actions minutes, which a public repository does not pay for.
  report:
    needs: watch
    # Stale records are found from the data alone, so a watch that failed or
    # timed out must not stop the list; its report only adds to it.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        # Uploaded only when a watched page moved.
        continue-on-error: true
        with:
          name: source-watch-report
          path: .sweep
      - id: worklist
        name: List the records that need re-checking
        run: |
          npx tsx tools/data/sweep-worklist.ts --watch-report .sweep/source-watch-report.json \
            --limit 150 --out .sweep/worklist.md >> "$GITHUB_OUTPUT"
          cat .sweep/worklist.md >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the re-check issue current
        env:
          GH_TOKEN: ${{ github.token }}
          COUNT: ${{ steps.worklist.outputs.count }}
          FAILING: ${{ steps.worklist.outputs.failing }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Exam records that need re-checking"
          today=$(TZ=Asia/Kolkata date '+%-d %b %Y')
          number=$(gh issue list --state open --search "in:title $title" --json number,title \
            --jq "map(select(.title == \"$title\")) | .[0].number // empty")
          if [ "$COUNT" = 0 ]; then
            if [ -n "$number" ]; then gh issue close "$number" --comment "Nothing left to re-check as of $today."; fi
            exit 0
          fi
          {
            echo "Updated by [the daily watch]($RUN_URL) on $today: $FAILING freshness-gate errors."
            echo
            echo "Re-check each record against its official notice and edit its module under \`data/exams/\` (docs/UPDATING.md)."
            echo "\`GATE\` items fail the strict freshness check; \`watched page\` items sit under an official page that changed; \`review due\` items have not been re-read for 25+ days."
            echo
            cat .sweep/worklist.md
          } > .sweep/issue.md
          if [ -n "$number" ]; then
            gh issue edit "$number" --body-file .sweep/issue.md
          else
            gh issue create --title "$title" --body-file .sweep/issue.md
          fi
