name: Validate static exam site

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify generated source registry is committed
        run: |
          npm run --silent data:registry
          git diff --exit-code -- data/source-registry.json
      - run: npm run check
