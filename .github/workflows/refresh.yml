# Rebuild the site every morning.
#
# The site is a static export, so every page ships with the date it was built
# on. The browser corrects what it can (see lib/use-today.ts), but anything
# rendered only on the server -- the ordering of /exams, an exam page's call to
# action, the footer's copyright year -- stays as built until someone pushes.
# Without this job that is "until someone happens to commit", which over a quiet
# month means a front page of expired deadlines.
#
# Needs a Vercel Deploy Hook in the VERCEL_DEPLOY_HOOK_URL secret:
#   Vercel project -> Settings -> Git -> Deploy Hooks -> create one for `main`.
# Until that secret exists the job reports the gap and stops, rather than
# failing every morning.
#
# GitHub disables cron workflows after 60 days without repository activity. If
# the repo goes that quiet, re-enable this from the Actions tab.
name: Refresh deployment

on:
  schedule:
    # 01:40 UTC = 07:10 IST, so the day's build lands before the morning traffic.
    - cron: "40 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  redeploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger a fresh production build
        env:
          DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "::warning::VERCEL_DEPLOY_HOOK_URL is not set, so the site is not being rebuilt daily."
            echo "Create a deploy hook for main in the Vercel project and add it as that secret." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          code=$(curl -sS -o response.txt -w '%{http_code}' -X POST "$DEPLOY_HOOK")
          echo "deploy hook responded $code" >> "$GITHUB_STEP_SUMMARY"
          if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
            cat response.txt
            exit 1
          fi
